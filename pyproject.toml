[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsysu-program-api"
version = "0.2.1"
description = "Unofficial, versioned static API for NSYSU program requirements"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pypdf==6.10.0", "pdfplumber==0.11.9", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17"]
ai = ["openai>=1.60"]

[project.scripts]
nsysu-program-api = "nsysu_program_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
