name: Scheduled source check
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - name: Fetch public sources (no AI key required)
        env:
          NSYSU_API_USER_AGENT: nsysu-program-api-source-check/1.0 (+${{ github.server_url }}/${{ github.repository }})
        run: |
          cp data/source/115-1/catalog.json /tmp/old.json
          python -m nsysu_program_api.cli --root . --academic-version 115-1 full > reports/source-check-current.json
          python -m nsysu_program_api.cli --root . diff /tmp/old.json data/source/115-1/catalog.json --output reports/semantic-diff.json
      - uses: actions/upload-artifact@v4
        with:
          name: nsysu-source-check-${{ github.run_id }}
          path: |
            reports/source-check-current.json
            reports/semantic-diff.json
            data/extracted/115-1/
          retention-days: 30
      # Deliberately no write permission and no automatic publication.
      # A maintainer reviews the artifact, then opens an issue/branch/PR manually.

